# GastoControl — vhost Apache (frontend estático + proxy /api al backend OCR)
# Sustituye __DOMAIN__ por tu dominio y __OCR_PORT__ por el puerto del backend (p. ej. 8010).
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot /var/www/gastoscontrol

    # Evita el Alias global de Apache (/icons/ -> /usr/share/apache2/icons/)
    Alias /icons/ /var/www/gastoscontrol/icons/
    <Directory /var/www/gastoscontrol/icons>
        Require all granted
    </Directory>

    <Directory /var/www/gastoscontrol>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # SPA fallback (sirve index.html solo si la ruta no existe como fichero)
        FallbackResource /index.html
    </Directory>

    # API -> backend FastAPI OCR (solo /api)
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /api http://127.0.0.1:__OCR_PORT__/api
    ProxyPassReverse /api http://127.0.0.1:__OCR_PORT__/api

    ErrorLog ${APACHE_LOG_DIR}/gastoscontrol-error.log
    CustomLog ${APACHE_LOG_DIR}/gastoscontrol-access.log combined
</VirtualHost>
