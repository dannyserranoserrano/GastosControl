# GastoControl — vhost Apache (redirección a HTTPS)
# Sustituye __DOMAIN__ por tu dominio. El sitio solo se sirve por HTTPS
# (Supabase OAuth exige https). El reto ACME de Let's Encrypt se deja pasar.
<VirtualHost *:80>
    ServerName __DOMAIN__

    RewriteEngine On
    # No redirigir el reto de renovación de certificados
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/gastoscontrol-error.log
    CustomLog ${APACHE_LOG_DIR}/gastoscontrol-access.log combined
</VirtualHost>
