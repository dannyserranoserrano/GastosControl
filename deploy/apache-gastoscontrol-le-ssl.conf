<IfModule mod_ssl.c>
# GastoControl — vhost HTTPS. Generado/ajustado por certbot; aquí la plantilla base.
<VirtualHost *:443>
    ServerName __DOMAIN__
    DocumentRoot /var/www/gastoscontrol

    Alias /icons/ /var/www/gastoscontrol/icons/
    <Directory /var/www/gastoscontrol/icons>
        Require all granted
    </Directory>

    <Directory /var/www/gastoscontrol>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass /api http://127.0.0.1:__OCR_PORT__/api
    ProxyPassReverse /api http://127.0.0.1:__OCR_PORT__/api

    # --- Cabeceras de seguridad (solo este vhost) ---
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # CSP: permite Google Fonts y Supabase; 'unsafe-inline' para el script anti-parpadeo
    # del tema y los estilos inline. Ajusta si añades más orígenes.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.telegram.org https://api.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

    ErrorLog ${APACHE_LOG_DIR}/gastoscontrol-error.log
    CustomLog ${APACHE_LOG_DIR}/gastoscontrol-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
