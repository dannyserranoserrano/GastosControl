# GastoControl — filtro fail2ban para el endpoint OCR
# Instala en /etc/fail2ban/filter.d/gastoscontrol-ocr.conf
#
# Marca abuso del OCR: peticiones sin la clave (401), demasiado grandes (413)
# o bloqueadas por el rate limit (429).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /api/receipts/scan[^"]*" (?:401|413|429|500)
            ^<HOST> \S+ \S+ \[[^\]]+\] "GET /api/files[^"]*" (?:401|429)
ignoreregex =
